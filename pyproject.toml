[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crimson-atlas"
version = "0.1.0"
description = "Local interactive Crimson Desert map with live coordinates, markers, and teleport"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymem>=1.0.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "types-websockets",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
